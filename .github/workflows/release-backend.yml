name: Release backend image

# Builds the production API image and pushes it to GitHub Container Registry:
#
#   ghcr.io/<owner>/splitfy-api:<tag>     e.g. :v1.2.0
#   ghcr.io/<owner>/splitfy-api:latest    only for tags without a pre-release suffix
#
# Deploying it is left to the hosting platform (see docs/DEPLOYMENT.md): most can
# pull from GHCR on a webhook or a schedule, or you can add a deploy step here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest :backend:test --stacktrace

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Registry paths must be lower case; the owner may not be.
          images: ghcr.io/${{ github.repository_owner }}/splitfy-api
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
