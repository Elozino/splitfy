name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  # :core and :backend are pure JVM, so they run on the cheap
  # ubuntu runners and gate everything else.
  jvm:
    name: Core + backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Core domain tests
        run: ./gradlew :core:jvmTest --stacktrace

      - name: Backend tests
        run: ./gradlew :backend:test --stacktrace

      - name: Backend fat JAR
        run: ./gradlew :backend:buildFatJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            core/build/reports/tests/
            backend/build/reports/tests/
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:androidApp:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: splitfy-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  # macOS runners are the expensive ones, so the iOS job only starts once the JVM
  # checks are green.
  ios:
    name: iOS
    runs-on: macos-14
    needs: jvm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Client tests (Kotlin/Native)
        run: ./gradlew :app:shared:iosSimulatorArm64Test --stacktrace

      - name: Link iOS framework
        run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
