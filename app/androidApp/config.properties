# Build-time configuration for the Android app — the counterpart to
# app/iosApp/Configuration/*.xcconfig.
#
# Every value here is read by build.gradle.kts and reaches the app as either a
# manifest placeholder or a BuildConfig field, so changing the API host or the app
# name never means editing Kotlin.
#
# Anything personal goes in config.local.properties instead. It is gitignored and
# read second, so its values win.

app.name=splitfy
app.applicationId=com.elozino.splitfy
app.versionCode=1
app.versionName=1.0.0

# 10.0.2.2 is how the Android emulator reaches the host machine's loopback, which
# is where `./gradlew :backend:run` listens. A build running on a physical device
# needs your machine's LAN address here — put that in config.local.properties.
api.baseUrl.debug=http://10.0.2.2:8080
api.baseUrl.release=https://api.splitfy.app
