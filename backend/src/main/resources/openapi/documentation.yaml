openapi: 3.0.3
info:
  title: splitfy API
  version: 1.0.0
  description: |
    Bill-splitting backend for the splitfy Kotlin Multiplatform client.

    **Money** is always an object of `{ amount, currency }` where `amount` is an
    integer number of minor units (kobo, cents). Floating point is never used.

    **Splits** are submitted as inputs (participants, percentages, shares) — never
    as pre-computed amounts. The server recomputes every split so rounding is
    identical for all clients.

    **Errors** always use the same envelope: `{ code, message, fieldErrors, traceId }`.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.splitfy.app
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Groups
  - name: Expenses
  - name: Settlements
  - name: Wallet
  - name: Transfers
  - name: Activity
  - name: Notifications
  - name: Contacts
  - name: Uploads
  - name: Security
  - name: System

paths:
  /api/v1/groups/{groupId}/invite:
    get:
      tags: [Groups]
      summary: Get or create the group's shared invite link (members only)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Invite link, valid for 30 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupInvite' }
        "404": { description: Group not found or caller is not a member }
        "409": { description: Group is archived }

  /api/v1/groups/{groupId}/invite/reset:
    post:
      tags: [Groups]
      summary: Revoke old links and create a new one (owner or admin only)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Replacement invite link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupInvite' }
        "403": { description: Caller is not an owner or admin }
        "409": { description: Group is archived }

  /api/v1/invites/{token}:
    get:
      tags: [Groups]
      summary: Preview a group invitation without signing in
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Group name, member count, inviter and currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        "404": { description: Invalid, expired or revoked link, or archived group }

  /api/v1/invites/{token}/accept:
    post:
      tags: [Groups]
      summary: Join the group as a member; repeated acceptance is idempotent
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Joined group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        "401": { description: Sign-in required }
        "404": { description: Invalid, expired or revoked link, or archived group }

  /health:
    get:
      tags: [System]
      summary: Liveness probe — never touches a dependency
      security: []
      responses:
        "200": { description: Process is alive }

  /ready:
    get:
      tags: [System]
      summary: Readiness probe — verifies database connectivity
      security: []
      responses:
        "200": { description: Ready to serve traffic }
        "503": { description: A dependency is unavailable }

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics — off unless METRICS_TOKEN is set
      description: |
        Answers 404 while METRICS_TOKEN is unset. Once set, the scraper must send
        `Authorization: Bearer <METRICS_TOKEN>`; this is not a user access token.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }
        "401": { description: Missing or wrong metrics token }
        "404": { description: Metrics are disabled on this deployment }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Create an account and receive a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a token pair, or a two-step challenge
      description: |
        Without two-step verification the body is an `AuthResponse` (user and tokens).
        With it, only `twoFactor` is set: send its `challengeToken` and a code to
        `POST /api/v1/auth/2fa/verify` within five minutes to get tokens.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceName" }
        - { $ref: "#/components/parameters/DevicePlatform" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in, or the password was right and a code is needed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      description: |
        The presented token is consumed. Replaying a consumed token revokes every
        session for that user, on the assumption the token was stolen. The new token
        stays in the same device session, whose name and platform are refreshed from
        the device headers.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceName" }
        - { $ref: "#/components/parameters/DevicePlatform" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a single refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm the signed-in user's email with the code sent at sign-up
      description: |
        A code is emailed on registration. After five wrong guesses the code stops
        working and a new one must be requested. Verifying an already-verified
        account is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Verified; the updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: The code is wrong, expired, or has been guessed at too often (code INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/verify-email/resend:
    post:
      tags: [Auth]
      summary: Email a new verification code
      description: At most one email per minute; extra requests are accepted silently.
      responses:
        "202":
          description: A code is on its way (or the account is already verified)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout/all:
    post:
      tags: [Auth]
      summary: Revoke every refresh token for the signed-in user
      description: |
        Signs the account out on every device. Unlike the other auth endpoints this
        one requires a valid access token, since it acts on the caller rather than on
        a presented refresh token.
      responses:
        "200":
          description: Signed out of all devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send a one-time reset code
      description: Always returns 202, whether or not the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  /api/v1/auth/oauth/{provider}:
    post:
      tags: [Auth]
      summary: Sign in with a Google or Apple ID token
      description: |
        Verifies the provider's ID token (signature, issuer, audience, expiry, and
        nonce when sent), then signs into the linked account, links an existing
        account with the same verified email, or creates one. An unverified password
        account holding the same email is taken over by the provider-verified owner,
        and its password and sessions are revoked.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
        - { $ref: "#/components/parameters/DeviceName" }
        - { $ref: "#/components/parameters/DevicePlatform" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                nonce: { type: string, nullable: true, description: "For Apple, the SHA-256 of the raw nonce" }
                displayName: { type: string, nullable: true, description: "Apple shares the name only on first sign-in" }
      responses:
        "200":
          description: Signed in, or a two-step challenge when the account has an authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResponse" }
        "400":
          description: The provider did not share a verified email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown provider, or the provider is not configured on this server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/auth/verify-otp:
    post:
      tags: [Auth]
      summary: Exchange a one-time code for a single-use reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        "200":
          description: Reset token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password and revoke all sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, resetToken, newPassword]
              properties:
                email: { type: string, format: email }
                resetToken: { type: string }
                newPassword: { type: string }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: The signed-in user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      tags: [Users]
      summary: Delete the signed-in user's account
      description: |
        Anonymises the account: the name becomes "Deleted user", the email is freed,
        and the password, linked Google/Apple identities, sessions, notifications and
        payment methods are removed. Past expenses and settlements stay in their
        groups so other members' history and balances do not change. Groups the user
        owned pass to the longest-standing remaining member. Refused with 409 while
        the user has a non-zero balance in any group (the message names the groups)
        or a non-zero wallet balance.
      responses:
        "204": { description: Account deleted; every session is signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/me/uploads:
    post:
      tags: [Users, Uploads]
      summary: Request a presigned URL to upload a profile photo
      description: |
        Same contract as `POST /groups/{groupId}/uploads`, for `purpose: AVATAR`
        only. The app crops and downscales the photo to a square JPEG first. Pass the
        returned `objectKey` as `avatarUrl` in `PATCH /users/me`, which accepts only
        avatar keys issued to the caller ("" removes the photo). Avatars in every
        response (`User`, `GroupMember`, `Contact`) are displayable URLs, like group
        covers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSlotRequest" }
      responses:
        "201":
          description: Upload slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSlot" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /api/v1/users/me/email-change:
    post:
      tags: [Users]
      summary: Start moving the account to a new email address
      description: |
        Sends a six-digit code to `newEmail` (not the current address); confirm it
        with `POST /users/me/email-change/confirm` within 30 minutes. A new request
        replaces any pending one. Refused with 409 `EMAIL_ALREADY_REGISTERED` when a
        verified account holds the address. An address held by an account that never
        verified it is not blocked: proving ownership wins, as with Google/Apple
        sign-in. At most one request a minute and five a day per account (429).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeRequest" }
      responses:
        "202":
          description: Code sent to the new address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChangePending" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/users/me/email-change/confirm:
    post:
      tags: [Users]
      summary: Confirm a change of email with the code sent to the new address
      description: |
        Moves the account to the new address and marks it verified, then emails the
        previous address that the account has moved. If an unverified account still
        holds the new address, it loses it: its email becomes a placeholder and its
        password is revoked. Five wrong codes burn the pending change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeConfirmRequest" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: "Code is wrong or expired (`INVALID_CREDENTIALS`)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/users/me/identities:
    get:
      tags: [Users]
      summary: Google/Apple identities linked to the account
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedAccountsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/identities/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, apple] }
    post:
      tags: [Users]
      summary: Link a Google or Apple identity to the signed-in account
      description: |
        Takes an ID token from the platform sign-in sheet, verified exactly as in
        `POST /auth/oauth/{provider}`. Linking an identity already on this account is
        a no-op. Refused with 409 when the identity belongs to another account, or
        when this account already has a different identity from the same provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                nonce: { type: string, nullable: true }
      responses:
        "200":
          description: Sign-in methods after linking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedAccountsResponse" }
        "400": { description: "The token could not be verified (`INVALID_CREDENTIALS`)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The provider is not configured on this server }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Users]
      summary: Unlink a Google or Apple identity
      description: |
        Refused with 409 when it is the account's last way to sign in: no other
        identity and no password the owner knows (`hasPassword` is false for
        accounts created through Google or Apple until a password is set through
        password reset).
      responses:
        "200":
          description: Sign-in methods after unlinking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedAccountsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/users/me/export:
    get:
      tags: [Users]
      summary: Download a copy of the caller's data
      description: |
        Everything the server holds about the caller as one JSON document, sent as
        an attachment with `Cache-Control: no-store`: profile, linked sign-in
        methods, groups, the expenses they paid or share, the settlements they paid
        or received, and their notifications. Other members appear by display name
        only. Credentials and receipt files are not included.
      responses:
        "200":
          description: The export
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="splitfy-data-2026-10-21.json"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/users/search:
    get:
      tags: [Users]
      summary: Find people to add to a group
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }

  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Users]
      summary: Another user's public profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups:
    get:
      tags: [Groups]
      summary: Groups the caller belongs to, with their balance in each
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Group summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupSummary" }
    post:
      tags: [Groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: A single group
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Groups]
      summary: Update group details (owner or admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/groups/{groupId}/archive:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Groups]
      summary: Archive or restore a group (owner or admin only)
      description: |
        Archiving hides the group from the default listing without deleting anything;
        its expenses and balances are untouched. Pass `?archived=false` to restore.
      parameters:
        - name: archived
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups/{groupId}/balances:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: Net balances plus the minimal set of settling transfers
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupBalancesResponse" }

  /api/v1/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Groups]
      summary: Add a member by id or email (owner or admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Groups]
      summary: Remove a member
      description: Fails with 409 while the member still has a non-zero balance.
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups/{groupId}/expenses:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Expenses]
      summary: Expenses in a group, newest first (keyset pagination)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of expenses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpensePage" }
    post:
      tags: [Expenses]
      summary: Add an expense
      description: |
        Send the split *inputs*; the server computes each participant's amount and
        guarantees the parts sum exactly to the total. Set `clientRequestId` to make
        a retry after a network timeout idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpenseRequest" }
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/groups/{groupId}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: expenseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Expenses]
      summary: A single expense
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
    patch:
      tags: [Expenses]
      summary: Edit an expense (author, owner or admin)
      description: |
        Every field is optional; omitted fields keep their current value. Sending a
        `split` re-runs the calculation, so the shares are replaced rather than merged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExpenseRequest" }
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Expenses]
      summary: Soft-delete an expense
      description: Sets `deletedAt`; the row is kept so balances stay reproducible.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/groups/{groupId}/expenses/{expenseId}/receipt:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: expenseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Expenses, Uploads]
      summary: A short-lived link to the expense's receipt (members only)
      description: |
        Receipts are private. Each call checks membership and returns a freshly
        signed GET URL that expires after five minutes; never store it.
      responses:
        "200":
          description: Signed link to the receipt file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "404": { description: No such expense, it has no receipt, or the caller is not a member }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /api/v1/groups/{groupId}/uploads:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Uploads]
      summary: Request a presigned URL to upload one file for this group
      description: |
        Members may upload receipts; only owners and admins may upload a cover photo.
        The response's `uploadUrl` accepts a single `PUT` of exactly `sizeBytes`
        bytes, sent with the returned `headers`, until `expiresAt` (15 minutes).
        Then pass `objectKey` as an expense's `receiptUrl` or the group's
        `coverImageUrl`; those fields accept nothing but keys issued here for the
        same group and purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSlotRequest" }
      responses:
        "201":
          description: Upload slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSlot" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { description: A cover photo was requested by a member who is not an owner or admin }
        "404": { description: Group not found or caller is not a member }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  /api/v1/uploads/config:
    get:
      tags: [Uploads]
      summary: Whether file uploads are available on this server
      description: The app hides its receipt and cover-photo controls when `enabled` is false.
      responses:
        "200":
          description: Upload availability and limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadConfig" }

  /api/v1/groups/{groupId}/settlements:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Settlements]
      summary: Payments recorded in a group
      responses:
        "200":
          description: Settlements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Settlement" }
    post:
      tags: [Settlements]
      summary: Record a payment (caller must be the payer or the payee)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSettlementRequest" }
      responses:
        "201":
          description: Settlement created, pending confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }

  /api/v1/groups/{groupId}/settlements/{settlementId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/SettlementId"
    delete:
      tags: [Settlements]
      summary: Cancel a pending settlement
      description: |
        Moves the settlement to `CANCELLED` rather than deleting the row, so the
        group's history stays auditable.
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups/{groupId}/settlements/{settlementId}/confirm:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/SettlementId"
    post:
      tags: [Settlements]
      summary: Confirm receipt — only the payee may call this
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/wallet:
    get:
      tags: [Wallet]
      summary: The caller's spendable balance
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }

  /api/v1/wallet/ledger:
    get:
      tags: [Wallet]
      summary: Money statement, newest first
      description: |
        The append-only ledger. `?type=TOP_UP&type=WITHDRAWAL` narrows it; unknown
        values are ignored rather than failing the request.
      parameters:
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [TOP_UP, WITHDRAWAL, TRANSFER_OUT, TRANSFER_IN, EXPENSE_SETTLEMENT]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of ledger entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerPage" }

  /api/v1/wallet/top-up:
    post:
      tags: [Wallet]
      summary: Add money from a saved payment method
      description: Send `clientRequestId` so a retry after a timeout cannot double-credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paymentMethodId]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
                paymentMethodId: { type: string, format: uuid }
                clientRequestId: { type: string, nullable: true }
      responses:
        "201":
          description: Wallet credited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletOperationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/wallet/withdraw:
    post:
      tags: [Wallet]
      summary: Move money out to a saved payment method
      description: Fails with `INSUFFICIENT_FUNDS` rather than allowing a negative balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paymentMethodId]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
                paymentMethodId: { type: string, format: uuid }
                clientRequestId: { type: string, nullable: true }
      responses:
        "201":
          description: Withdrawal recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletOperationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/payment-methods:
    get:
      tags: [Wallet]
      summary: Saved funding sources
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMethod" }
    post:
      tags: [Wallet]
      summary: Register a funding source
      description: |
        **Send a provider token, never a card number.** The device exchanges the card
        details with the payment provider's SDK and posts the resulting opaque token
        plus the last four digits. A request whose `providerToken` looks like a PAN is
        rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, label, providerToken]
              properties:
                type: { type: string, enum: [CARD, BANK_ACCOUNT, PAYPAL, GOOGLE_PAY, APPLE_PAY] }
                label: { type: string }
                providerToken: { type: string }
                brand: { type: string, nullable: true }
                last4: { type: string, nullable: true, minLength: 4, maxLength: 4 }
                makeDefault: { type: boolean, default: false }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/payment-methods/{methodId}:
    parameters:
      - name: methodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Wallet]
      summary: Remove a funding source
      responses:
        "200":
          description: The remaining payment methods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMethod" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/payment-methods/{methodId}/default:
    parameters:
      - name: methodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Wallet]
      summary: Make this the default funding source
      responses:
        "200":
          description: All payment methods, with the new default flagged
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMethod" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/transfers:
    get:
      tags: [Transfers]
      summary: Payments and requests the caller is party to
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Transfers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transfer" }
    post:
      tags: [Transfers]
      summary: Pay someone, or ask someone for money
      description: |
        `PAYMENT` settles immediately and debits the caller. `REQUEST` only creates a
        pending record — money moves when the person being asked approves, so nobody
        can pull funds from someone else's wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, counterpartyId, amount]
              properties:
                kind: { type: string, enum: [PAYMENT, REQUEST] }
                counterpartyId: { type: string, format: uuid }
                amount: { $ref: "#/components/schemas/Money" }
                note: { type: string, nullable: true }
                groupId: { type: string, format: uuid, nullable: true }
                clientRequestId: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/transfers/{transferId}/approve:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Transfers]
      summary: Approve a request — only the person being asked may call this
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/transfers/{transferId}/decline:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Transfers]
      summary: Decline (payer) or cancel (requester) a pending request
      responses:
        "200": { description: Updated }

  /api/v1/activity:
    get:
      tags: [Activity]
      summary: Who owes whom, across every group
      description: Derived from the ledger on read, so it can never disagree with balances.
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [ALL, YOU_OWE, OWED_TO_YOU], default: ALL }
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResponse" }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: In-app notifications with an unread count
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsResponse" }

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark everything read
      responses:
        "200":
          description: The refreshed list, with `unreadCount` at zero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsResponse" }

  /api/v1/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      summary: Mark one notification read
      responses:
        "200":
          description: The refreshed list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsResponse" }

  /api/v1/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Which events are pushed to the caller's devices
      description: |
        Every switch defaults to on. They gate push notifications only: the in-app
        list keeps everything. Security and account messages are always pushed.
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    patch:
      tags: [Notifications]
      summary: Change push preferences
      description: Omitted fields keep their current value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotificationPreferencesRequest" }
      responses:
        "200":
          description: The preferences after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }

  /api/v1/devices:
    post:
      tags: [Notifications]
      summary: Register this device's push token
      description: |
        Idempotent. The token is an FCM registration token (Android, and iOS through
        the Firebase SDK). Registering a token that belonged to another account moves
        it to the caller, so a shared phone only notifies whoever is signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
      responses:
        "204":
          description: Registered
        "400":
          description: Empty or oversized token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  /api/v1/devices/unregister:
    post:
      tags: [Notifications]
      summary: Stop pushing to this device
      description: Idempotent; called on sign-out. Only the token's owner can remove it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnregisterDeviceRequest" }
      responses:
        "204":
          description: Unregistered (or was not registered)

  /api/v1/contacts:
    get:
      tags: [Contacts]
      summary: People the caller shares a group with
      description: |
        There is no separate address book: contacts are derived from group membership,
        so the app never needs phone-book access.
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactsResponse" }

  /api/v1/contacts/{contactId}/favorite:
    parameters:
      - name: contactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Contacts]
      summary: Add or remove a favourite
      parameters:
        - name: favorite
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: The refreshed contact lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactsResponse" }

  /api/v1/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Second sign-in step - trade a challenge and a code for tokens
      description: |
        `code` is the authenticator app's current six digits or one unused recovery
        code (which is then spent). A challenge lasts five minutes and allows five
        wrong codes; five wrong codes on the account (from anywhere) lock code entry
        for fifteen minutes.
      security: []
      parameters:
        - { $ref: "#/components/parameters/DeviceName" }
        - { $ref: "#/components/parameters/DevicePlatform" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorVerifyRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Wrong code (`INVALID_CREDENTIALS`), or an expired or used challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/security:
    get:
      tags: [Security]
      summary: Password and two-step verification status for the Security screen
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/security/password:
    post:
      tags: [Security]
      summary: Change the password, or set one for a Google/Apple account
      description: |
        `currentPassword` is required unless `SecurityOverview.hasPassword` is false.
        On success every other device is signed out; the calling device stays signed in.
        A wrong current password is a 400 (`INVALID_CREDENTIALS`), not a 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/security/sessions:
    get:
      tags: [Security]
      summary: Devices currently signed in to this account
      description: One entry per device session (a chain of rotating refresh tokens), most recently used first.
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/security/sessions/{id}:
    delete:
      tags: [Security]
      summary: Sign one device out
      description: |
        Its refresh token stops working at once; an access token it already holds
        lasts until it expires (at most 15 minutes). The calling device cannot
        remove itself here (use logout).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/security/sessions/revoke-others:
    post:
      tags: [Security]
      summary: Sign out of every device except this one
      responses:
        "200":
          description: How many sessions were ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedSessionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/security/2fa/setup:
    post:
      tags: [Security]
      summary: Start enrolling an authenticator app
      description: |
        Returns a new secret and its `otpauth://` URI (for a QR code). Sign-in is
        unchanged until `/security/2fa/enable` confirms a code. Calling again
        replaces a pending secret. Needs a verified email address.
      responses:
        "200":
          description: Secret to add to the authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetupResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/security/2fa/enable:
    post:
      tags: [Security]
      summary: Confirm the authenticator app with a code and turn two-step verification on
      description: Returns ten single-use recovery codes. They are stored hashed and cannot be shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorEnableRequest" }
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesResponse" }
        "400":
          description: Wrong code (`INVALID_CREDENTIALS`) or setup not started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/security/2fa/disable:
    post:
      tags: [Security]
      summary: Turn two-step verification off
      description: Needs a current authenticator code, an unused recovery code, or the account password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorDisableRequest" }
      responses:
        "200":
          description: Disabled (also when it was already off)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400":
          description: Wrong code or password (`INVALID_CREDENTIALS`), or neither given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
    DeviceName:
      name: X-Device-Name
      in: header
      description: What the device calls itself (e.g. "Pixel 8"), shown in the session list. Up to 100 characters.
      schema: { type: string }
    DevicePlatform:
      name: X-Device-Platform
      in: header
      schema: { type: string, enum: [ANDROID, IOS] }

  responses:
    ValidationError:
      description: The request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    NotFound:
      description: No such resource, or the caller may not see it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Conflict:
      description: The request conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    StorageUnavailable:
      description: Object storage is not configured on this server (`STORAGE_UNAVAILABLE`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  schemas:
    EmailChangeRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail: { type: string, format: email }

    EmailChangePending:
      type: object
      required: [newEmail, expiresAt]
      properties:
        newEmail: { type: string, format: email }
        expiresAt: { type: string, format: date-time }

    EmailChangeConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    LinkedIdentity:
      type: object
      required: [provider, linkedAt]
      properties:
        provider: { type: string, enum: [GOOGLE, APPLE] }
        email: { type: string, format: email, nullable: true }
        linkedAt: { type: string, format: date-time }

    LinkedAccountsResponse:
      type: object
      required: [identities, hasPassword, availableProviders]
      properties:
        identities:
          type: array
          items: { $ref: "#/components/schemas/LinkedIdentity" }
        hasPassword:
          type: boolean
          description: False for Google/Apple accounts that never set a password
        availableProviders:
          type: array
          description: Providers this server can verify, i.e. the ones that can be linked
          items: { type: string, enum: [GOOGLE, APPLE] }

    DataExport:
      type: object
      description: Amounts are decimal strings in the item's currency.
      required: [format, exportedAt, profile, linkedAccounts, groups, expenses, settlements, notifications]
      properties:
        format: { type: string, example: splitfy-export/1 }
        exportedAt: { type: string, format: date-time }
        profile:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            emailVerified: { type: boolean }
            displayName: { type: string }
            phoneNumber: { type: string, nullable: true }
            defaultCurrency: { type: string }
            hasPassword: { type: boolean }
            createdAt: { type: string, format: date-time }
        linkedAccounts:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              email: { type: string, nullable: true }
              linkedAt: { type: string, format: date-time }
        groups:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              currency: { type: string }
              role: { type: string }
              joinedAt: { type: string, format: date-time }
              archived: { type: boolean }
        expenses:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              groupId: { type: string, format: uuid }
              groupName: { type: string, nullable: true }
              description: { type: string }
              category: { type: string }
              amount: { type: string }
              yourShare: { type: string }
              currency: { type: string }
              paidByYou: { type: boolean }
              paidBy: { type: string, nullable: true }
              notes: { type: string, nullable: true }
              incurredAt: { type: string, format: date-time }
        settlements:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              groupId: { type: string, format: uuid }
              groupName: { type: string, nullable: true }
              direction: { type: string, enum: [PAID, RECEIVED] }
              counterparty: { type: string, nullable: true }
              amount: { type: string }
              currency: { type: string }
              status: { type: string }
              note: { type: string, nullable: true }
              settledAt: { type: string, format: date-time }
        notifications:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              title: { type: string }
              message: { type: string }
              read: { type: boolean }
              createdAt: { type: string, format: date-time }

    UploadSlotRequest:
      type: object
      required: [purpose, contentType, sizeBytes]
      properties:
        purpose: { type: string, enum: [RECEIPT, GROUP_COVER, AVATAR] }
        contentType:
          type: string
          description: |
            `image/jpeg`, `image/png` or `image/heic`; receipts may also be
            `application/pdf`.
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 10485760 }

    UploadSlot:
      type: object
      required: [uploadUrl, objectKey, expiresAt]
      properties:
        uploadUrl: { type: string, format: uri }
        objectKey: { type: string, example: "groups/0b7c…/receipts/Xq3….jpg" }
        expiresAt: { type: string, format: date-time }
        headers:
          type: object
          description: Send these with the PUT exactly as given; they are signed.
          additionalProperties: { type: string }

    FileLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    UploadConfig:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        maxBytes: { type: integer, format: int64 }

    GroupInvite:
      type: object
      required: [token, url, expiresAt]
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    InvitePreview:
      type: object
      required: [groupId, groupName, memberCount, invitedBy, currency]
      properties:
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        memberCount: { type: integer }
        invitedBy: { type: string }
        currency: { type: string }
    MessageResponse:
      type: object
      required: [message]
      description: Returned by endpoints whose only result is "done".
      properties:
        message: { type: string }

    WalletOperationResponse:
      type: object
      description: The updated wallet plus the ledger entry just written, for a receipt.
      properties:
        wallet: { $ref: "#/components/schemas/Wallet" }
        entryId: { type: string, format: uuid }

    LedgerPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }

    ActivityResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/DebtEntry" }
        totalYouOwe: { $ref: "#/components/schemas/Money" }
        totalOwedToYou: { $ref: "#/components/schemas/Money" }

    NotificationsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppNotification" }
        unreadCount: { type: integer }

    NotificationPreferences:
      type: object
      properties:
        newExpenses: { type: boolean, description: An expense was added to one of your groups }
        settlements: { type: boolean, description: A payment to or from you was recorded, confirmed or cancelled }
        groupActivity: { type: boolean, description: Someone joined a group through your invite }
        paymentReminders: { type: boolean, description: Daily nudge about money you have owed for a while }

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        newExpenses: { type: boolean }
        settlements: { type: boolean }
        groupActivity: { type: boolean }
        paymentReminders: { type: boolean }

    RegisterDeviceRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, maxLength: 512 }
        platform: { type: string, enum: [ANDROID, IOS] }

    UnregisterDeviceRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ContactsResponse:
      type: object
      description: |
        `favorites` is a filtered view of the same people, not a separate set — a
        favourited contact appears in both lists.
      properties:
        contacts:
          type: array
          items: { $ref: "#/components/schemas/Contact" }
        favorites:
          type: array
          items: { $ref: "#/components/schemas/Contact" }

    Wallet:
      type: object
      properties:
        userId: { type: string, format: uuid }
        balance: { $ref: "#/components/schemas/Money" }
        updatedAt: { type: string, format: date-time }

    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [TOP_UP, WITHDRAWAL, TRANSFER_OUT, TRANSFER_IN, EXPENSE_SETTLEMENT]
        amount: { $ref: "#/components/schemas/Money" }
        balanceAfter:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The balance immediately after this entry, stored so statements never change.
        description: { type: string }
        counterpartyName: { type: string, nullable: true }
        paymentMethodLabel: { type: string, nullable: true }
        paymentMethodBrand: { type: string, nullable: true }
        note: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    PaymentMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [CARD, BANK_ACCOUNT, PAYPAL, GOOGLE_PAY, APPLE_PAY] }
        label: { type: string }
        brand: { type: string, nullable: true }
        last4:
          type: string
          nullable: true
          description: Display digits only. The full number is never stored.
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }

    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [PAYMENT, REQUEST] }
        status: { type: string, enum: [PENDING, COMPLETED, DECLINED, CANCELLED] }
        fromUserId: { type: string, format: uuid }
        fromName: { type: string }
        toUserId: { type: string, format: uuid }
        toName: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        note: { type: string, nullable: true }
        groupId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    DebtEntry:
      type: object
      properties:
        fromUserId: { type: string, format: uuid }
        fromName: { type: string }
        toUserId: { type: string, format: uuid }
        toName: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        isSettled: { type: boolean }
        lastActivityAt: { type: string, format: date-time }

    AppNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [SYSTEM, SECURITY, PAYMENT, GROUP, PROMOTION] }
        title: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    Contact:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        isFavorite: { type: boolean }
        sharedGroupCount: { type: integer }
        netBalance:
          allOf:
            - $ref: "#/components/schemas/Money"
          nullable: true
          description: Positive means they owe the caller. Only same-currency groups are summed.

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units. `1234` with currency `NGN` means ₦12.34.
        currency:
          type: string
          example: NGN
          description: ISO-4217 code.

    ApiErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [VALIDATION_FAILED, MALFORMED_REQUEST, SPLIT_INVALID, CURRENCY_MISMATCH,
             INVALID_CREDENTIALS, TOKEN_EXPIRED, TOKEN_INVALID, UNAUTHORIZED, FORBIDDEN,
             NOT_FOUND, EMAIL_ALREADY_REGISTERED, ALREADY_MEMBER, CONFLICT,
             RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE, STORAGE_UNAVAILABLE]
        message: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        traceId:
          type: string
          description: Matches the `X-Request-Id` response header and the server logs.

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        phoneNumber: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        defaultCurrency: { type: string }
        createdAt: { type: string, format: date-time }
        emailVerified:
          type: boolean
          description: Whether the user has confirmed their email. Only verified accounts can be found or added by email.

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer, format: int64 }
        tokenType: { type: string, default: Bearer }

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/TokenPair" }

    SignInResponse:
      type: object
      description: Either `user` and `tokens` (signed in), or only `twoFactor` (a code is needed).
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/TokenPair" }
        twoFactor: { $ref: "#/components/schemas/TwoFactorChallenge" }

    TwoFactorChallenge:
      type: object
      required: [challengeToken, expiresInSeconds]
      properties:
        challengeToken: { type: string }
        expiresInSeconds: { type: integer, format: int64 }

    TwoFactorVerifyRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code: { type: string, description: "Six digits from the authenticator app, or a recovery code" }

    SecurityOverview:
      type: object
      required: [hasPassword, twoFactorEnabled]
      properties:
        hasPassword:
          type: boolean
          description: False for Google/Apple accounts that never chose a password; they may set one without a current password.
        twoFactorEnabled: { type: boolean }
        recoveryCodesRemaining: { type: integer }

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, nullable: true }
        newPassword: { type: string, minLength: 8 }

    DeviceSession:
      type: object
      required: [id, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string, nullable: true }
        platform: { type: string, enum: [ANDROID, IOS], nullable: true }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean, description: "The device making this request" }

    RevokedSessionsResponse:
      type: object
      properties:
        revoked: { type: integer }

    TwoFactorSetupResponse:
      type: object
      properties:
        secret: { type: string, description: "Base32, for typing into the app by hand" }
        otpauthUri: { type: string, description: "otpauth://totp/... for a QR code" }

    TwoFactorEnableRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    RecoveryCodesResponse:
      type: object
      properties:
        recoveryCodes:
          type: array
          items: { type: string }

    TwoFactorDisableRequest:
      type: object
      properties:
        code: { type: string, nullable: true }
        password: { type: string, nullable: true }

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string, maxLength: 60 }
        phoneNumber: { type: string, nullable: true }
        defaultCurrency: { type: string, default: NGN }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceId: { type: string, nullable: true }

    UpdateProfileRequest:
      type: object
      properties:
        displayName: { type: string }
        phoneNumber: { type: string }
        avatarUrl:
          type: string
          description: An AVATAR `objectKey` from `POST /users/me/uploads`, or "" to remove the photo
        defaultCurrency:
          type: string
          description: ISO 4217 code; preselected for new groups

    GroupMember:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        joinedAt: { type: string, format: date-time }

    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, enum: [TRIP, HOME, COUPLE, EVENT, PROJECT, OTHER] }
        currency: { type: string }
        coverImageUrl:
          type: string
          nullable: true
          description: Displayable URL of the cover photo. Signed links expire, so do not store it.
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }

    GroupSummary:
      type: object
      properties:
        group: { $ref: "#/components/schemas/Group" }
        totalSpend: { $ref: "#/components/schemas/Money" }
        yourBalance: { $ref: "#/components/schemas/Money" }
        expenseCount: { type: integer }

    CreateGroupRequest:
      type: object
      required: [name, currency]
      properties:
        name: { type: string, maxLength: 60 }
        description: { type: string, nullable: true }
        category: { type: string, default: OTHER }
        currency: { type: string }
        coverImageUrl:
          type: string
          nullable: true
          description: Must be null. Upload a cover once the group exists, then PATCH it.
        memberIds:
          type: array
          items: { type: string, format: uuid }

    UpdateGroupRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        coverImageUrl:
          type: string
          description: A GROUP_COVER `objectKey` issued for this group, or "" to remove the cover.

    AddMemberRequest:
      type: object
      description: Provide either `userId` or `email`.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER], default: MEMBER }

    Balance:
      type: object
      properties:
        userId: { type: string, format: uuid }
        net:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Positive means the group owes them; negative means they owe.

    SuggestedTransfer:
      type: object
      properties:
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }

    GroupBalancesResponse:
      type: object
      properties:
        groupId: { type: string, format: uuid }
        currency: { type: string }
        balances:
          type: array
          items: { $ref: "#/components/schemas/Balance" }
        suggestedTransfers:
          type: array
          items: { $ref: "#/components/schemas/SuggestedTransfer" }

    SplitPayload:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [EQUAL, EXACT, PERCENTAGE, SHARES] }
        participantIds:
          type: array
          description: EQUAL only. Empty means every member of the group.
          items: { type: string, format: uuid }
        exactAmounts:
          type: object
          description: EXACT only — minor units per user id. Must sum to the total.
          additionalProperties: { type: integer, format: int64 }
        basisPoints:
          type: object
          description: PERCENTAGE only — 1% = 100. Must sum to 10000.
          additionalProperties: { type: integer }
        shares:
          type: object
          description: SHARES only — positive share counts per user id.
          additionalProperties: { type: integer }

    ExpenseShare:
      type: object
      properties:
        userId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        weight: { type: integer, format: int64 }

    Expense:
      type: object
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        description: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        category: { type: string }
        paidBy: { type: string, format: uuid }
        splitMethod: { type: string, enum: [EQUAL, EXACT, PERCENTAGE, SHARES] }
        shares:
          type: array
          items: { $ref: "#/components/schemas/ExpenseShare" }
        receiptUrl:
          type: string
          nullable: true
          description: The receipt's object key. Fetch a viewable link from `/receipt`.
        notes: { type: string, nullable: true }
        incurredAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    ExpensePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Expense" }
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }

    CreateExpenseRequest:
      type: object
      required: [description, total, paidBy, split]
      properties:
        description: { type: string, maxLength: 140 }
        total: { $ref: "#/components/schemas/Money" }
        category: { type: string, default: OTHER }
        paidBy: { type: string, format: uuid }
        split: { $ref: "#/components/schemas/SplitPayload" }
        receiptUrl:
          type: string
          nullable: true
          description: A RECEIPT `objectKey` issued for this group by `POST /groups/{groupId}/uploads`.
        notes: { type: string, nullable: true }
        incurredAt: { type: string, format: date-time, nullable: true }
        clientRequestId:
          type: string
          nullable: true
          description: Idempotency key, unique per group.

    UpdateExpenseRequest:
      type: object
      description: |
        A partial update — every field is optional and omitted fields are left alone.
        There is no `clientRequestId`, because an edit is already idempotent.
      properties:
        description: { type: string, maxLength: 140 }
        total: { $ref: "#/components/schemas/Money" }
        category: { type: string }
        paidBy: { type: string, format: uuid }
        split: { $ref: "#/components/schemas/SplitPayload" }
        receiptUrl:
          type: string
          nullable: true
          description: A RECEIPT `objectKey` issued for this group, or "" to remove the receipt.
        notes: { type: string, nullable: true }
        incurredAt: { type: string, format: date-time, nullable: true }

    Settlement:
      type: object
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED] }
        note: { type: string, nullable: true }
        settledAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CreateSettlementRequest:
      type: object
      required: [fromUserId, toUserId, amount]
      properties:
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        note: { type: string, nullable: true }
        settledAt: { type: string, format: date-time, nullable: true }
        clientRequestId: { type: string, nullable: true }
