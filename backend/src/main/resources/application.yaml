ktor:
  application:
    modules:
      - com.elozino.splitfy.backend.ApplicationKt.module
  deployment:
    port: "$PORT:8080"
    # On SIGTERM, /ready answers 503 at once; requests keep being served for the
    # grace period (so the load balancer notices) and in-flight ones get until the
    # timeout to finish. Keep the timeout below the platform's kill deadline.
    shutdownGracePeriod: "$SHUTDOWN_GRACE_MS:5000"
    shutdownTimeout: "$SHUTDOWN_TIMEOUT_MS:20000"

app:
  # LOCAL | STAGING | PRODUCTION
  environment: "$APP_ENV:LOCAL"

database:
  jdbcUrl: "$DATABASE_URL:jdbc:postgresql://localhost:5432/splitfy"
  username: "$DATABASE_USER:splitfy"
  # The app refuses to boot in PRODUCTION while this default is still in place.
  password: "$DATABASE_PASSWORD:splitfy"
  driver: "$DATABASE_DRIVER:org.postgresql.Driver"
  maxPoolSize: "$DATABASE_POOL_SIZE:10"
  runMigrations: "$DATABASE_RUN_MIGRATIONS:true"
  statementTimeoutSeconds: "$DATABASE_STATEMENT_TIMEOUT_SECONDS:30"

jwt:
  # Override in every deployed environment. The app refuses to boot in PRODUCTION
  # while this default is still in place.
  secret: "$JWT_SECRET:local-development-secret-do-not-use-in-production"
  issuer: "$JWT_ISSUER:https://api.splitfy.app"
  audience: "$JWT_AUDIENCE:splitfy-mobile"
  realm: "$JWT_REALM:splitfy"
  accessTokenMinutes: "$JWT_ACCESS_MINUTES:15"
  refreshTokenDays: "$JWT_REFRESH_DAYS:30"

security:
  bcryptCost: "$BCRYPT_COST:12"
  otpMinutes: "$OTP_MINUTES:10"
  # Encrypts authenticator-app (TOTP) secrets at rest. Required in production; at
  # least 32 random characters, e.g. `openssl rand -base64 32`. Changing it disables
  # every enrolled authenticator, so treat it like a database key.
  totpEncryptionKey: "$TOTP_ENCRYPTION_KEY:"

cors:
  # Empty outside production means "any host", which suits local web tooling.
  allowedHosts: []

email:
  # Password-reset codes go through Resend when a key is set. Without one they are
  # only logged, and the server refuses to start in PRODUCTION.
  resendApiKey: "$RESEND_API_KEY:"
  # Must be on a domain verified in Resend.
  from: "$EMAIL_FROM:splitfy <no-reply@splitfy.app>"

oauth:
  # Comma-separated OAuth client ids. Leaving one empty turns that provider off.
  googleClientIds: "$GOOGLE_CLIENT_IDS:"
  appleClientIds: "$APPLE_CLIENT_IDS:"

links:
  # Invite links are $PUBLIC_BASE_URL/i/<token>; that host must route to this API.
  publicBaseUrl: "$PUBLIC_BASE_URL:https://splitfy.app"
  androidPackage: "$ANDROID_PACKAGE:com.elozino.splitfy"
  # Comma-separated. Release signing certificate SHA-256 (keytool -list -v).
  androidCertSha256: "$ANDROID_CERT_SHA256:"
  # Comma-separated TEAMID.bundle ids, e.g. ABCDE12345.com.elozino.splitfy
  appleAppIds: "$APPLE_APP_IDS:"

observability:
  # Sentry error reporting. Empty turns it off; no events leave the server.
  sentryDsn: "$SENTRY_DSN:"
  # Tags error reports with the build; the release workflow sets it to the image tag.
  release: "$APP_VERSION:"
  # /metrics (Prometheus) needs `Authorization: Bearer <token>`. Empty disables the
  # endpoint (404). At least 24 characters when set.
  metricsToken: "$METRICS_TOKEN:"

push:
  # Firebase Cloud Messaging service-account key: the JSON itself, or a path to the
  # file. With neither, pushes are only logged; push is optional and never blocks boot.
  fcmServiceAccountJson: "$FCM_SERVICE_ACCOUNT_JSON:"
  fcmServiceAccountPath: "$FCM_SERVICE_ACCOUNT_PATH:"
  # Daily nudge for balances owed longer than reminderAfterDays, at most once per
  # group every reminderEveryDays. Safe with several instances: one claims each day.
  remindersEnabled: "$PAYMENT_REMINDERS_ENABLED:true"
  reminderAfterDays: "$PAYMENT_REMINDER_AFTER_DAYS:3"
  reminderEveryDays: "$PAYMENT_REMINDER_EVERY_DAYS:7"
  reminderHourUtc: "$PAYMENT_REMINDER_HOUR_UTC:9"

storage:
  # S3-compatible object storage for receipts and group cover photos (AWS S3 or
  # Cloudflare R2). Uploads are off unless endpoint, bucket and both keys are set.
  endpoint: "$STORAGE_ENDPOINT:"
  bucket: "$STORAGE_BUCKET:"
  accessKey: "$STORAGE_ACCESS_KEY:"
  secretKey: "$STORAGE_SECRET_KEY:"
  # "auto" for R2; the bucket's region (e.g. eu-west-1) for AWS.
  region: "$STORAGE_REGION:auto"
  # Optional public host for cover photos. Without it covers use signed links too.
  publicBaseUrl: "$STORAGE_PUBLIC_BASE_URL:"

features:
  # Wallet, top-up, withdrawal, payment methods and peer transfers. Leave off until a
  # payment provider is integrated: a top-up currently credits without charging.
  wallet: "$FEATURE_WALLET:false"
